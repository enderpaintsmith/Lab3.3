<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">

  <title>Frontend Mentor | Blog preview card</title>
</head>

<body>

  <main class="container-fluid min-vh-100">

    <div class="row min-vh-100 justify-content-center align-items-center">

      <div class="col-auto">

        <article class="card blog-card p-4 shadow">

          <img src="./assets/images/illustration-article.svg" class="card-img-top rounded-3" alt="Article illustration">

          <div class="card-body px-0 pb-0">

            <span class="badge text-bg-warning mb-3">
              Learning
            </span>

            <p class="mb-3">
              Published 21 Dec 2023
            </p>

            <h1 class="fs-4 fw-bold mb-3">
              HTML & CSS foundations
            </h1>

            <p class="text-secondary mb-4">
              These languages are the backbone of every <br>
              website, defining structure, content, and <br>
              presentation.
            </p>

            <div class="d-flex align-items-center gap-2">

              <img src="./assets/images/image-avatar.webp" class="avatar-image rounded-circle" alt="Greg Hooper">

              <strong>Greg Hooper</strong>

            </div>

          </div>

        </article>

      </div>

    </div>

  </main>

</body>

</html>
